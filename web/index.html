<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>The Hub</title>
<style>
:root{--bg:#0b0f17;--card:#141b27;--line:#222c3d;--text:#e8edf5;--dim:#8794a8;--acc:#2bd9b4;--warn:#ffb84d;--bad:#ff6b6b;--ok:#46d37d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:12px;min-height:100vh;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:12px}
#clock{font-size:64px;font-weight:300;letter-spacing:-1px;line-height:1}
#date{color:var(--dim);font-size:18px}
#wx{margin-left:auto;text-align:right;color:var(--dim)}
#wx b{color:var(--text);font-size:30px;font-weight:400}
#badge{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
#badge.off{color:var(--bad);border-color:var(--bad)}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:7px 0}
.row .l{width:64px;color:var(--dim);font-size:14px}
.row .v{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;min-width:84px;text-align:right}
.bar{flex:1;height:10px;background:#0b111b;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .5s}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.big{font-size:34px;font-weight:300}
.dim{color:var(--dim)}.sm{font-size:13px}
.ev{display:flex;gap:10px;margin:7px 0}
.ev .t{width:64px;color:var(--dim);font-size:14px;flex:none}
.ev .d{width:3px;border-radius:2px;flex:none;background:var(--acc)}
.day{margin:10px 0 2px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.media{display:flex;gap:14px}
.media img{width:110px;height:110px;border-radius:10px;object-fit:cover;background:#0b111b;flex:none}
.media .m{min-width:0;flex:1}
.media .ti{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl button{min-width:48px;padding:10px 12px}
button{font:inherit;color:var(--text);background:#1d2736;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:56px;cursor:pointer}
button:active{background:#2a3850}
button.on{background:var(--acc);color:#04251f;border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tiles button{padding:14px 6px;font-size:14px}
.spark{display:flex;align-items:flex-end;gap:1px;height:36px;margin-top:6px}
.spark i{flex:1;background:var(--acc);min-height:2px;border-radius:1px}
.spark i.x{background:var(--bad)}
.card.wide{grid-column:span 2}
.accts{display:flex;gap:24px;flex-wrap:wrap}.accts .acct{flex:1;min-width:240px}
@media(max-width:700px){.card.wide{grid-column:auto}}
.days{display:flex;align-items:flex-end;gap:6px;height:54px;margin-top:10px}
.days i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
#alert{display:none;margin-bottom:12px;padding:14px 16px;border-radius:14px;background:#3a2a0d;border:1px solid var(--warn)}
#alert b{color:var(--warn)}
#alert .ctl{margin-top:8px}
.hidden{display:none!important}
body.stale .pc{opacity:.35}
body.night{filter:brightness(.4)}
.gh{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;margin:8px 0}
.gh i{aspect-ratio:1;border-radius:2px;background:#1a2433}
.gh i.l1{background:#0e4b3f}.gh i.l2{background:#12806a}.gh i.l3{background:#1fb896}.gh i.l4{background:#2bd9b4}
.fc{display:flex;gap:10px;overflow:hidden;margin-top:8px}.fc>div{flex:1;text-align:center;font-size:13px;min-width:44px}
.fc b{display:block;font-weight:500;font-size:15px}
.lab{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.lab>div{display:flex;align-items:center;gap:8px;font-size:14px}
.lab i{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}.lab i.dn{background:var(--bad)}
.feed{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.feed .t{width:58px;flex:none;color:var(--dim);font-size:13px}
.feed .b{min-width:0;flex:1}
.feed .s{font-size:12px;padding:1px 8px;border-radius:99px;background:#1d2736;color:var(--dim);flex:none}
.feed .s.ok{background:#0f3a2d;color:var(--ok)}.feed .s.bad{background:#4a1b1b;color:var(--bad)}.feed .s.warn{background:#4a3a14;color:var(--warn)}
.nasd{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.nasd span{font-size:12px;padding:2px 8px;border-radius:8px;background:#1d2736;color:var(--dim)}
.nasd span.warn{color:var(--warn)}.nasd span.bad{color:var(--bad)}
.hatiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.hatiles button{padding:14px 8px;font-size:14px;line-height:1.2}
.hatiles button .st{display:block;font-size:11px;opacity:.7;margin-top:2px}
.hasens{margin-top:12px}.hasens>div{display:flex;justify-content:space-between;gap:8px;margin:5px 0;font-size:14px}
.hasens .open{color:var(--warn)}.hasens .closed{color:var(--ok)}
#banner{display:none;margin-bottom:12px}
.bn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;margin-bottom:6px;border:1px solid}
.bn.crit{background:#3a1515;border-color:var(--bad)}.bn.warn{background:#3a2a0d;border-color:var(--warn)}
.bn b{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.bn.crit b{color:var(--bad)}.bn.warn b{color:var(--warn)}
.bn button{margin-left:auto;padding:6px 12px;min-width:0;font-size:13px}
body.alerting .bn.crit{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{border-color:#ffb0b0}}
#tmr .big{font-variant-numeric:tabular-nums}
#tmr.done .big{color:var(--warn);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
.pr{margin:8px 0 14px}.pr:last-child{margin-bottom:0}
.pr .n{display:flex;justify-content:space-between;gap:8px}
.st{font-size:12px;padding:1px 8px;border-radius:99px;background:#1d2736;color:var(--dim)}
.st.run{background:#0f3a2d;color:var(--ok)}.st.err{background:#4a1b1b;color:var(--bad)}
.games{display:flex;gap:8px;flex-wrap:wrap}
.games div{width:72px;text-align:center;font-size:11px;color:var(--dim)}
.games img{width:72px;height:108px;object-fit:cover;border-radius:6px;background:#0b111b;display:block;margin-bottom:3px}
.play img{width:100%;border-radius:10px;margin-bottom:8px;display:block}
</style>
</head>
<body>
<header>
  <div><div id="clock">--:--</div><div id="date"></div></div>
  <span id="badge" class="off">connecting…</span>
  <div id="wx" class="hidden"></div>
</header>
<div id="banner"></div>
<div id="login" class="card hidden" style="max-width:360px;margin:40px auto">
  <h2>The Hub</h2><div class="dim" id="lmsg" style="margin-bottom:10px">Enter the code</div>
  <form id="lform" style="display:flex;gap:8px"><input id="lcode" type="password" autocomplete="off" inputmode="text" style="flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b111b;color:var(--text)"><button>Open</button></form>
</div>
<div id="alert"></div>
<div id="grid">
  <section class="card hidden pc" id="c-ai"><h2>Claude Code</h2><div id="ai"></div></section>
  <section class="card hidden pc" id="c-stats"><h2>PC</h2><div id="stats"></div></section>
  <section class="card hidden pc" id="c-media"><h2>Now playing</h2><div id="media"></div></section>
  <section class="card hidden pc" id="c-events"><h2>Calendar</h2><div id="events"></div></section>
  <section class="card hidden pc" id="c-printer"><h2>3D printers</h2><div id="printer"></div></section>
  <section class="card hidden pc" id="c-steam"><h2>Games</h2><div id="steam"></div></section>
  <section class="card hidden" id="c-net"><h2>Internet</h2><div id="net"></div></section>
  <section class="card hidden pc" id="c-gh"><h2>GitHub</h2><div id="gh"></div></section>
  <section class="card hidden" id="c-fc"><h2>Weather</h2><div id="fc"></div></section>
  <section class="card" id="c-tmr"><h2>Timer</h2><div id="tmr"></div></section>
  <section class="card hidden" id="c-ha"><h2>Home</h2><div id="ha"></div></section>
  <section class="card hidden" id="c-nas"><h2>NAS</h2><div id="nas"></div></section>
  <section class="card hidden" id="c-doors"><h2>Door access</h2><div id="doors"></div></section>
  <section class="card hidden" id="c-calls"><h2>Phone calls</h2><div id="calls"></div></section>
  <section class="card hidden" id="c-jarvis"><h2>JARVIS</h2><div id="jarvis"></div></section>
  <section class="card hidden" id="c-lab"><h2>Lab status</h2><div id="lab" class="lab"></div></section>
  <section class="card hidden pc" id="c-tiles"><h2>Shortcuts</h2><div id="tiles" class="tiles"></div></section>
</div>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
let TOKEN = Q.get("token") || load("deskhub-code");
if (Q.get("token")) { store("deskhub-code", Q.get("token")); history.replaceState(null, "", location.pathname); }
let PLACE = {lat: Q.get("lat"), lon: Q.get("lon"), unit: Q.get("unit")};
const $ = id => document.getElementById(id);
const S = {};            // latest message per type
const ART = {media: null, steam: {}};
let controls = false, companion = false, ws = null, delay = 1000;

// A tiny element builder; text goes in as text, never as HTML.
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e[k] = v;
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
function put(id, ...kids) { const el = $(id); el.replaceChildren(...kids.flat().filter(Boolean)); }
function show(id, on) { $(id).classList.toggle("hidden", !on); }
const fmtN = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "K" : String(Math.round(n));
const fmtB = n => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : (n / 1e6).toFixed(0) + " MB";
const fmtRate = k => k >= 1024 ? (k / 1024).toFixed(1) + " MB/s" : Math.round(k) + " KB/s";
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const hhmm = t => new Date(t * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
function until(t) {
  const m = Math.max(0, Math.round((t * 1000 - Date.now()) / 60000));
  return m >= 1440 ? Math.floor(m / 1440) + "d " + Math.floor(m % 1440 / 60) + "h" : m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + "m";
}
function bar(pct, warn = 70, bad = 90) {
  const p = Math.max(0, Math.min(100, pct || 0));
  return h("div", {class: "bar"}, h("i", {class: p >= bad ? "b" : p >= warn ? "w" : "", style: `width:${p}%`}));
}
function line(label, pct, text, warn, bad) {
  return h("div", {class: "row"}, h("span", {class: "l"}, label), bar(pct, warn, bad), h("span", {class: "v"}, text));
}
function send(o) { if (controls && ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---- clock and weather --------------------------------------------------
function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  $("date").textContent = d.toLocaleDateString([], {weekday: "long", month: "long", day: "numeric"});
  const m = S.media;
  if (m && m.active && m.playing && m._at) renderMediaBar();
}
setInterval(tick, 1000); tick();

const WX = {0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle",
  61: "Rain", 63: "Rain", 65: "Heavy rain", 71: "Snow", 73: "Snow", 75: "Heavy snow", 80: "Showers", 81: "Showers", 82: "Downpour",
  95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm"};
async function weather() {
  const lat = PLACE.lat, lon = PLACE.lon;
  if (lat === null || lat === undefined || lat === "" || lon === null || lon === undefined || lon === "") return;
  try {
    const unit = PLACE.unit === "c" ? "celsius" : "fahrenheit";
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&temperature_unit=${unit}&timezone=auto&forecast_days=6`);
    const j = await r.json();
    const sym = unit === "celsius" ? "°C" : "°F";
    $("wx").replaceChildren(h("b", {}, Math.round(j.current.temperature_2m) + sym), h("div", {},
      (WX[j.current.weather_code] || "") + " · " + Math.round(j.daily.temperature_2m_max[0]) + "° / " + Math.round(j.daily.temperature_2m_min[0]) + "°"));
    show("wx", true);
    const now = Date.now(), hrs = [];
    for (let i = 0; i < j.hourly.time.length && hrs.length < 8; i++) {
      const t = new Date(j.hourly.time[i]);
      if (t.getTime() > now - 1800000 && t.getHours() % 2 === 0) hrs.push([t, j.hourly.temperature_2m[i], j.hourly.weather_code[i]]);
    }
    const col = (a, b, c) => h("div", {}, h("div", {class: "dim"}, a), h("b", {}, b), h("div", {class: "dim"}, c));
    show("c-fc", true);
    put("fc", h("div", {class: "fc"}, hrs.map(([t, v, c]) => col(t.toLocaleTimeString([], {hour: "numeric"}), Math.round(v) + "°", WX[c] || ""))),
      h("div", {class: "fc", style: "margin-top:14px"}, j.daily.time.slice(1, 6).map((d, i) => col(
        new Date(d + "T12:00").toLocaleDateString([], {weekday: "short"}),
        Math.round(j.daily.temperature_2m_max[i + 1]) + "° / " + Math.round(j.daily.temperature_2m_min[i + 1]) + "°",
        WX[j.daily.weather_code[i + 1]] || ""))));
  } catch (e) { console.warn("weather failed:", e); }
}
weather();
setInterval(weather, 15 * 60 * 1000);

// ---- cards ----------------------------------------------------------------
function aiSection(a, name) {
  const L = a.limits || {}, out = [];
  if (name) out.push(h("div", {style: "font-weight:600;margin-bottom:4px"}, name));
  for (const [k, label] of [["five_hour", "5 hour"], ["seven_day", "Weekly"]]) {
    if (L[k]) out.push(line(label, L[k].pct, Math.round(L[k].pct) + "% · " + until(L[k].reset), 70, 90));
  }
  const blk = a.block || {};
  if (!out.length || (name && !L.five_hour && !L.seven_day)) {
    if (blk.active) out.push(h("div", {class: "dim sm"}, "Block resets in " + until(blk.reset) + " · " + fmtN(blk.tokens) + " tokens"));
  }
  const t = a.today || {};
  out.push(h("div", {class: "row"}, h("span", {class: "big"}, fmtN(t.tokens || 0)), h("span", {class: "dim sm"}, "tokens today · " + (t.messages || 0) + " messages")));
  const days = a.days || [], mx = Math.max(1, ...days);
  if (days.length) out.push(h("div", {class: "days"}, days.map(v => h("i", {style: `height:${Math.max(3, v / mx * 100)}%`}))));
  // models arrives as a list of {name, tokens}
  const models = (Array.isArray(a.models) ? a.models.map(m => [m.name, m.tokens]) : Object.entries(a.models || {})).sort((x, y) => y[1] - x[1]);
  if (models.length) out.push(h("div", {class: "dim sm", style: "margin-top:8px"}, models.map(([n, v]) => n + " " + fmtN(v)).join(" · ")));
  return h("div", {class: "acct"}, out);
}
function renderAi() {
  const multi = S.ai_accounts && S.ai_accounts.accounts && S.ai_accounts.accounts.length > 1 ? S.ai_accounts.accounts : null;
  const a = S.ai || S.claude;
  if (!multi && !a) return show("c-ai", false);
  show("c-ai", true);
  $("c-ai").classList.toggle("wide", !!multi);
  put("ai", multi ? h("div", {class: "accts"}, multi.map(x => aiSection(x, x.name))) : aiSection(a, null));
}
function renderStats() {
  const s = S.stats;
  if (!s) return show("c-stats", false);
  show("c-stats", true);
  const out = [h("div", {class: "dim sm"}, [s.cpu_name, s.gpu_name].filter(Boolean).join(" · "))];
  out.push(line("CPU", s.cpu, Math.round(s.cpu) + "%"));
  if (s.gpu !== undefined) out.push(line("GPU", s.gpu, Math.round(s.gpu) + "%" + (s.gpu_temp ? " · " + s.gpu_temp + "°C" : "")));
  out.push(line("RAM", s.ram_used / s.ram_total * 100, s.ram_used.toFixed(1) + " / " + s.ram_total + " GB"));
  if (s.vram_total) out.push(line("VRAM", s.vram_used / s.vram_total * 100, s.vram_used.toFixed(1) + " / " + s.vram_total + " GB"));
  out.push(line("Disk", s.disk, Math.round(s.disk) + "%", 80, 92));
  out.push(h("div", {class: "dim sm", style: "margin-top:6px"}, "↓ " + fmtRate(s.net_down) + "   ↑ " + fmtRate(s.net_up)));
  put("stats", out);
}
function renderMedia() {
  const m = S.media;
  if (!m || !m.active) return show("c-media", false);
  show("c-media", true);
  m._at = Date.now(); m._pos = m.pos || 0;
  const img = h("img", {alt: "", src: ART.media || "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="});
  const btn = (t, cmd) => h("button", {onclick: () => send({type: "media", cmd})}, t);
  put("media", h("div", {class: "media"}, img, h("div", {class: "m"},
    h("div", {class: "ti"}, m.title || "—"), h("div", {class: "dim"}, [m.artist, m.album].filter(Boolean).join(" · ")),
    h("div", {class: "dim sm"}, m.source || ""),
    h("div", {class: "row", id: "mrow"}), controls ? h("div", {class: "ctl"}, btn("⏮", "prev"), btn(m.playing ? "⏸" : "▶", "toggle"), btn("⏭", "next")) : null)));
  renderMediaBar();
}
function renderMediaBar() {
  const m = S.media, row = $("mrow");
  if (!m || !row) return;
  const pos = m.playing ? Math.min(m.dur || 1e9, m._pos + (Date.now() - m._at) / 1000) : m._pos;
  row.replaceChildren(h("span", {class: "dim sm"}, mmss(pos)), bar(m.dur ? pos / m.dur * 100 : 0, 101, 101), h("span", {class: "dim sm"}, mmss(m.dur || 0)));
}
function renderEvents() {
  if (!S.events) return show("c-events", false);
  const ev = S.events.events || [];
  show("c-events", true);
  if (!ev.length) return put("events", h("div", {class: "dim"}, "No events in the next " + ((S.events && S.events.days) || 7) + " days"));
  const out = []; let last = "";
  for (const e of ev.slice(0, 10)) {
    const d = new Date(e.start * 1000), key = d.toDateString();
    if (key !== last) {
      last = key;
      const today = new Date().toDateString() === key;
      out.push(h("div", {class: "day"}, today ? "Today" : d.toLocaleDateString([], {weekday: "long", month: "short", day: "numeric"})));
    }
    const col = typeof e.color === "string" && /^#[0-9a-f]{3,8}$/i.test(e.color) ? e.color : null;
    out.push(h("div", {class: "ev"}, h("div", {class: "d", style: col ? "background:" + col : null}),
      h("div", {class: "t"}, e.all_day ? "All day" : hhmm(e.start)),
      h("div", {}, h("div", {}, e.title), e.loc ? h("div", {class: "dim sm"}, e.loc) : null)));
  }
  put("events", out);
}
function renderPrinters() {
  const ps = (S.printer && S.printer.printers) || [];
  if (!ps.length) return show("c-printer", false);
  show("c-printer", true);
  put("printer", ps.map(p => {
    const cls = !p.online ? "" : p.error ? "err" : /RUN|PRINT/i.test(p.state) ? "run" : "";
    const t = (v, tg) => v === null || v === undefined ? "" : Math.round(v) + (tg ? "/" + Math.round(tg) : "") + "°";
    return h("div", {class: "pr"},
      h("div", {class: "n"}, h("b", {}, p.name), h("span", {class: "st " + cls}, p.online ? p.state : "offline")),
